services:
  ollama:
    image: ollama/ollama:0.11.4
    restart: unless-stopped
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - ollama_models:/root/.ollama

  faster-whisper:
    build: ./services/faster-whisper
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - faster_whisper_models:/models

  postgres:
    image: postgres:18.4-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-summyz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-esta-senha}
      POSTGRES_USER: ${POSTGRES_USER:-summyz}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - summyz_data:/app/data

  smoke:
    profiles: ["smoke"]
    build:
      context: .
      target: test
    depends_on:
      faster-whisper:
        condition: service_healthy
      ollama:
        condition: service_healthy

volumes:
  faster_whisper_models:
  ollama_models:
  postgres_data:
  summyz_data:
