name: CI implementation

on:
  workflow_call:

env:
  NODE_VERSION: 22.23.2
  NPM_VERSION: 10.9.8
  PYTHON_VERSION: 3.12.14

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up exact Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked Node.js dependencies
        run: |
          npm install --global "npm@${NPM_VERSION}"
          npm ci

      - name: Verify npm and Node.js versions
        shell: bash
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"

      - name: Check formatting, linting, types, and builds
        shell: bash
        run: |
          mkdir -p artifacts/reports/quality
          quality_status=0
          ./node_modules/.bin/biome ci . --reporter=sarif \
            --reporter-file=artifacts/reports/quality/biome.sarif || quality_status=1
          npm run typecheck 2>&1 | tee artifacts/reports/quality/typecheck-server.txt || quality_status=1
          npm run typecheck:web 2>&1 | tee artifacts/reports/quality/typecheck-dashboard.txt || quality_status=1
          npm run build 2>&1 | tee artifacts/reports/quality/build.txt || quality_status=1
          echo "${quality_status}" > artifacts/reports/quality/node.status

      - name: Set up exact Python
        if: always()
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/ci.lock

      - name: Install verified CI tools
        if: always()
        run: python -m pip install --require-hashes --requirement requirements/ci.lock

      - name: Check Python formatting, linting, and types
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/reports/quality
          quality_status=0
          ruff check services/faster-whisper --output-format sarif \
            --output-file artifacts/reports/quality/ruff.sarif || quality_status=1
          ruff format --check services/faster-whisper 2>&1 \
            | tee artifacts/reports/quality/ruff-format.txt || quality_status=1
          mypy services/faster-whisper 2>&1 \
            | tee artifacts/reports/quality/mypy.txt || quality_status=1
          # ruff has no cognitive complexity rule (only C901, which is cyclomatic), so the
          # Python side gets the same metric Biome enforces on TypeScript.
          complexipy services/faster-whisper \
            --exclude "test_*.py" \
            --cache-dir .cache/complexipy \
            --max-complexity-allowed 15 \
            --output-format sarif \
            --output artifacts/reports/quality/complexipy.sarif \
            --quiet || quality_status=1
          echo "${quality_status}" > artifacts/reports/quality/python.status

      - name: Analyze source metrics
        if: always()
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git diff --output=artifacts/reports/quality/source.diff "${BASE_SHA}...HEAD" -- \
            src web/src services/faster-whisper
          ./node_modules/.bin/jscpd \
            --min-lines 5 \
            --min-tokens 50 \
            --threshold 3 \
            --exit-code 0 \
            --reporters console,json,html \
            --output artifacts/reports/quality/jscpd \
            --format typescript,tsx,python \
            --skip-comments \
            --ignore "**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/test_*.py,**/*.d.ts" \
            --absolute \
            src web/src services/faster-whisper
          # lizard has no JSX parser: on .tsx it loses the end of a function and folds the
          # rest of the file into it, so its numbers do not describe the code. Cognitive
          # complexity for .tsx is enforced by Biome instead (see biome.json overrides).
          lizard -l typescript -l python -C 10 -i -1 \
            -x "*test*" -x "*spec*" --csv -o artifacts/reports/quality/lizard.csv \
            src web/src services/faster-whisper
          lizard -l typescript -l python -C 10 -i -1 \
            -x "*test*" -x "*spec*" --xml -o artifacts/reports/quality/lizard.xml \
            src web/src services/faster-whisper
          ./node_modules/.bin/tsx scripts/ci/source-quality-cli.ts \
            artifacts/reports/quality/source.diff \
            artifacts/reports/quality/jscpd/jscpd-report.json \
            artifacts/reports/quality/lizard.csv \
            artifacts/reports/quality/lizard.xml \
            artifacts/reports/quality/source-quality.json

      - name: Enforce quality checks
        if: always()
        shell: bash
        run: |
          test "$(cat artifacts/reports/quality/node.status 2>/dev/null)" = "0"
          test "$(cat artifacts/reports/quality/python.status 2>/dev/null)" = "0"

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-quality
          path: artifacts/reports/quality
          if-no-files-found: warn

  security:
    name: Security
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the complete tested history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up exact Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up exact npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Initialize security reports
        if: always()
        run: mkdir -p artifacts/reports/security

      - name: Audit Node.js runtime dependencies
        shell: bash
        run: |
          set +e
          npm audit --package-lock-only --omit=optional --json > artifacts/reports/security/npm-audit.json
          audit_status=$?
          set -e
          test "${audit_status}" -le 1
          node -e 'const report=require("./artifacts/reports/security/npm-audit.json"); if(report.error) process.exit(1)'

      - name: Set up exact Python
        if: always()
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/ci.lock

      - name: Install verified security tools
        if: always()
        run: python -m pip install --require-hashes --requirement requirements/ci.lock

      - name: Audit Python runtime dependencies
        if: always()
        shell: bash
        run: |
          audit_status=0
          pip-audit --strict --requirement services/faster-whisper/requirements.lock \
            --format json --output artifacts/reports/security/pip-audit.json || audit_status=$?
          test "${audit_status}" -le 1

      - name: Scan GitHub Actions definitions
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          zizmor --min-severity medium --format sarif
          .github/workflows > artifacts/reports/security/zizmor.sarif

      - name: Scan the complete history for secrets
        if: always()
        shell: bash
        run: |
          docker run --rm -v "${PWD}:/repo" \
            zricethezav/gitleaks:v8.24.0@sha256:2bcceac45179b3a91bff11a824d0fb952585b429e54fc928728b1d4d5c3e5176 \
            detect --source=/repo --redact --verbose --no-banner \
              --report-format=sarif --report-path=/repo/artifacts/reports/security/gitleaks.sarif

      - name: Report every repository vulnerability
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          ignore-unfixed: false
          format: json
          output: artifacts/reports/security/trivy-filesystem.json
          exit-code: "0"
          version: v0.74.0

      - name: Enforce repository secret and misconfiguration policy
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          limit-severities-for-sarif: true
          output: artifacts/reports/security/trivy-policy.sarif
          exit-code: "1"
          version: v0.74.0

      - name: Enforce fixable HIGH/CRITICAL dependency vulnerabilities
        if: always()
        shell: bash
        run: |
          jq -e '
            [
              .Results[]?.Vulnerabilities[]?
              | select(
                  (.Severity == "HIGH" or .Severity == "CRITICAL")
                  and ((.FixedVersion // "") | length > 0)
                )
            ] | length == 0
          ' artifacts/reports/security/trivy-filesystem.json
          jq -e '
            [
              .vulnerabilities[]?
              | select(
                  (.severity == "high" or .severity == "critical")
                  and (.fixAvailable != false and .fixAvailable != null)
                )
            ] | length == 0
          ' artifacts/reports/security/npm-audit.json

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-security
          path: artifacts/reports/security
          if-no-files-found: warn

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: summyz_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_USER: summyz_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U summyz_ci -d summyz_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out the tested revision and its base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the exact Node.js test environment
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          target: test
          load: true
          tags: summyz-community-tests:ci
          cache-from: type=gha,scope=summyz-node-tests
          cache-to: type=gha,mode=max,scope=summyz-node-tests,ignore-error=true

      - name: Initialize test reports
        run: |
          mkdir -p artifacts/reports
          chmod 0777 artifacts/reports

      - name: Run server tests with real PostgreSQL and coverage
        run: >-
          docker run --rm --network host
          --env POSTGRES_TEST_URL=postgresql://summyz_ci:ci-only-password@127.0.0.1:5432/summyz_ci
          --volume "${{ github.workspace }}/artifacts/reports:/app/artifacts/reports"
          summyz-community-tests:ci npm run test:coverage:ci

      - name: Run dashboard tests with coverage
        if: always()
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}/artifacts/reports:/app/artifacts/reports"
          summyz-community-tests:ci npm run test:web:coverage

      - name: Build the exact Python test environment
        if: always()
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/faster-whisper/Dockerfile
          target: test
          load: true
          tags: summyz-community-python-tests:ci
          cache-from: type=gha,scope=summyz-python-tests
          cache-to: type=gha,mode=max,scope=summyz-python-tests,ignore-error=true

      - name: Run Python tests with coverage
        if: always()
        run: |
          mkdir -p artifacts/reports/python
          chmod 0777 artifacts/reports/python
          docker run --rm \
            --volume "${{ github.workspace }}/artifacts/reports:/workspace/artifacts/reports" \
            summyz-community-python-tests:ci \
            python -m pytest services/faster-whisper \
            --cov=services/faster-whisper --cov-branch --cov-fail-under=85 \
            --cov-report=term-missing --cov-report=xml:artifacts/reports/python/coverage.xml \
            --cov-report=json:artifacts/reports/python/coverage.json \
            --cov-report=html:artifacts/reports/python/coverage --junitxml=artifacts/reports/python/junit.xml

      - name: Enforce 85% coverage for each domain group
        if: always()
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}/artifacts/reports:/app/artifacts/reports"
          summyz-community-tests:ci
          ./node_modules/.bin/tsx scripts/ci/coverage-domains.ts
          artifacts/reports/server/coverage/coverage-summary.json
          artifacts/reports/web/coverage/coverage-summary.json
          artifacts/reports/python/coverage.json
          artifacts/reports/domain-coverage/results.json

      - name: Set up exact Python for changed-code coverage # zizmor: ignore[cache-poisoning] Installs remain hash-verified.
        if: always()
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/ci.lock

      - name: Install verified coverage tools
        if: always()
        run: python -m pip install --require-hashes --requirement requirements/ci.lock

      - name: Measure coverage on changed code
        if: always()
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p artifacts/reports/diff-coverage
          git diff --output=artifacts/reports/diff-coverage/server.diff "${BASE_SHA}...HEAD" -- src
          git diff --relative=web --output=artifacts/reports/diff-coverage/web.diff "${BASE_SHA}...HEAD" -- web
          git diff --relative=services/faster-whisper \
            --output=artifacts/reports/diff-coverage/python.diff \
            "${BASE_SHA}...HEAD" -- services/faster-whisper
          for component in server web python; do
            case "${component}" in
              server) report="artifacts/reports/server/coverage/cobertura-coverage.xml" ;;
              web) report="artifacts/reports/web/coverage/cobertura-coverage.xml" ;;
              python) report="artifacts/reports/python/coverage.xml" ;;
            esac
            if [[ -s "${report}" ]]; then
              diff-cover "${report}" \
                --diff-file "artifacts/reports/diff-coverage/${component}.diff" \
                --format "html:artifacts/reports/diff-coverage/${component}.html,json:artifacts/reports/diff-coverage/${component}.json" \
                --fail-under 0
            else
              echo "::error::Missing ${component} coverage report: ${report}"
              exit 1
            fi
          done
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "${{ github.workspace }}/artifacts/reports:/app/artifacts/reports" \
            summyz-community-tests:ci \
            ./node_modules/.bin/tsx scripts/ci/changed-coverage-cli.ts \
            artifacts/reports/diff-coverage/server.json \
            artifacts/reports/diff-coverage/web.json \
            artifacts/reports/diff-coverage/python.json \
            artifacts/reports/diff-coverage/global.json \
            artifacts/reports/diff-coverage/global.md

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-tests-coverage
          path: artifacts/reports
          if-no-files-found: error

  runtime:
    name: Runtime / Images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preflight NVIDIA system packages
        shell: bash
        run: |
          repository_urls=(
            "https://archive.ubuntu.com/ubuntu/dists/noble/InRelease"
            "https://security.ubuntu.com/ubuntu/dists/noble-security/InRelease"
          )
          for repository_url in "${repository_urls[@]}"; do
            echo "Checking NVIDIA package repository: ${repository_url}"
            curl --fail --head --location --silent --show-error \
              --retry 5 --retry-all-errors --retry-max-time 180 \
              --connect-timeout 15 --max-time 60 \
              --output /dev/null "${repository_url}"
          done

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build bot image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          target: bot-runtime
          load: true
          tags: summyz-community-bot:ci
          cache-from: type=gha,scope=summyz-runtime
          cache-to: type=gha,mode=max,scope=summyz-runtime,ignore-error=true

      - name: Build dashboard image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          target: dashboard-runtime
          load: true
          tags: summyz-community-dashboard:ci
          cache-from: type=gha,scope=summyz-runtime
          cache-to: type=gha,mode=max,scope=summyz-runtime,ignore-error=true

      - name: Build CPU transcription image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/faster-whisper/Dockerfile
          target: cpu
          load: true
          tags: summyz-community-faster-whisper:ci
          cache-from: type=gha,scope=summyz-python-runtime
          cache-to: type=gha,mode=max,scope=summyz-python-runtime,ignore-error=true

      - name: Build smoke-test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          target: test
          load: true
          tags: summyz-community-smoke:latest
          cache-from: type=gha,scope=summyz-node-tests
          cache-to: type=gha,mode=max,scope=summyz-node-tests,ignore-error=true

      - name: Reclaim build storage before runtime validation
        run: |
          docker buildx prune --all --force
          docker image prune --force

      - name: Validate image users, versions, and Compose overlays
        shell: bash
        env:
          CI_OLLAMA_CACHE: ${{ github.workspace }}/.cache/ci/ollama
          CI_WHISPER_CACHE: ${{ github.workspace }}/.cache/ci/faster-whisper
          POSTGRES_PASSWORD: ci-only-password
          PUBLIC_BASE_URL: https://summyz.example.com
        run: |
          test "$(docker run --rm --entrypoint node summyz-community-bot:ci --version)" = "v${NODE_VERSION}"
          test "$(docker run --rm --entrypoint node summyz-community-dashboard:ci --version)" = "v${NODE_VERSION}"
          test "$(docker run --rm --entrypoint id summyz-community-bot:ci -u)" != "0"
          test "$(docker run --rm --entrypoint id summyz-community-dashboard:ci -u)" != "0"
          test "$(docker run --rm --entrypoint python summyz-community-faster-whisper:ci --version 2>&1)" = "Python ${PYTHON_VERSION}"
          test "$(docker run --rm --entrypoint id summyz-community-faster-whisper:ci -u)" != "0"
          docker compose -f compose.yaml -f .github/ci/docker-compose.ci.yaml config --quiet
          docker compose -f compose.yaml -f docker/compose.nvidia.yaml -f .github/ci/docker-compose.ci.yaml config --quiet
          docker compose -f compose.yaml -f docker/compose.amd.yaml -f .github/ci/docker-compose.ci.yaml config --quiet
          docker compose -f compose.yaml -f docker/compose.public.yaml -f .github/ci/docker-compose.ci.yaml config --quiet

      - name: Restore immutable local-model cache # zizmor: ignore[cache-poisoning] PR cache scope is isolated and models are verified.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/ci
          key: local-ai-d90ca5fe260221311c53c58e660288d3deb8d356-8f68893c685c3ddff2aa3fffce2aa60a30bb2da65ca488b61fff134a4d1730e7

      - name: Prepare local-model cache permissions
        shell: bash
        env:
          CI_OLLAMA_CACHE: ${{ github.workspace }}/.cache/ci/ollama
          CI_WHISPER_CACHE: ${{ github.workspace }}/.cache/ci/faster-whisper
        run: |
          mkdir -p "${CI_OLLAMA_CACHE}" "${CI_WHISPER_CACHE}"
          whisper_uid="$(docker run --rm --entrypoint id summyz-community-faster-whisper:ci -u)"
          whisper_gid="$(docker run --rm --entrypoint id summyz-community-faster-whisper:ci -g)"
          docker run --rm \
            --user "0:0" \
            --volume "${CI_WHISPER_CACHE}:/models" \
            --entrypoint chown \
            summyz-community-faster-whisper:ci \
            --recursive "${whisper_uid}:${whisper_gid}" /models

      - name: Run real CPU local-AI smoke test
        id: local_ai_smoke
        shell: bash
        env:
          CI_OLLAMA_CACHE: ${{ github.workspace }}/.cache/ci/ollama
          CI_WHISPER_CACHE: ${{ github.workspace }}/.cache/ci/faster-whisper
          POSTGRES_PASSWORD: ci-only-password
          SMOKE_OLLAMA_DIGEST: sha256:8f68893c685c3ddff2aa3fffce2aa60a30bb2da65ca488b61fff134a4d1730e7
          SMOKE_OLLAMA_MODEL: qwen3:1.7b
          SMOKE_WHISPER_MODEL: tiny
          SMOKE_WHISPER_REVISION: d90ca5fe260221311c53c58e660288d3deb8d356
        run: |
          docker tag summyz-community-faster-whisper:ci summyz-community-faster-whisper:latest
          docker compose -f compose.yaml -f .github/ci/docker-compose.ci.yaml \
            --profile smoke up --detach --no-build --wait --wait-timeout 180 ollama faster-whisper
          docker compose -f compose.yaml -f .github/ci/docker-compose.ci.yaml \
            --profile smoke run --rm --no-deps \
            -e SMOKE_OLLAMA_DIGEST -e SMOKE_OLLAMA_MODEL \
            -e SMOKE_WHISPER_MODEL -e SMOKE_WHISPER_REVISION smoke
          ollama_processes="$(
            docker compose -f compose.yaml -f .github/ci/docker-compose.ci.yaml \
              --profile smoke exec --no-TTY ollama ollama ps
          )"
          printf '%s\n' "${ollama_processes}"
          ollama_logs="$(
            docker compose -f compose.yaml -f .github/ci/docker-compose.ci.yaml \
              --profile smoke logs --no-color ollama
          )"
          printf '%s\n' "${ollama_logs}"
          ollama_compute="$(grep --fixed-strings 'msg="inference compute"' <<<"${ollama_logs}" || true)"
          if [[ -z "${ollama_compute}" ]]; then
            echo "Ollama did not report an inference compute backend." >&2
            exit 1
          fi
          grep --extended-regexp --quiet '(^|[[:space:]])id=cpu([[:space:]]|$)' <<<"${ollama_compute}"
          grep --extended-regexp --quiet '(^|[[:space:]])library=cpu([[:space:]]|$)' <<<"${ollama_compute}"
          if grep --extended-regexp --ignore-case --quiet \
            '(^|[[:space:]])library=(cuda|rocm|vulkan)[^[:space:]]*([[:space:]]|$)' \
            <<<"${ollama_compute}"; then
            echo "Ollama reported a GPU inference backend." >&2
            exit 1
          fi

      - name: Diagnose local-AI smoke-test failure
        if: failure() && steps.local_ai_smoke.outcome == 'failure'
        shell: bash
        env:
          CI_OLLAMA_CACHE: ${{ github.workspace }}/.cache/ci/ollama
          CI_WHISPER_CACHE: ${{ github.workspace }}/.cache/ci/faster-whisper
          POSTGRES_PASSWORD: ci-only-password
        run: |
          docker compose -f compose.yaml -f .github/ci/docker-compose.ci.yaml \
            --profile smoke ps --all
          docker compose -f compose.yaml -f .github/ci/docker-compose.ci.yaml \
            --profile smoke logs --no-color --timestamps ollama faster-whisper

      - name: Stop local-AI services
        if: always()
        env:
          CI_OLLAMA_CACHE: ${{ github.workspace }}/.cache/ci/ollama
          CI_WHISPER_CACHE: ${{ github.workspace }}/.cache/ci/faster-whisper
          POSTGRES_PASSWORD: ci-only-password
        run: >-
          docker compose -f compose.yaml -f .github/ci/docker-compose.ci.yaml
          --profile smoke down --volumes

      - name: Initialize runtime reports
        if: always()
        run: mkdir -p artifacts/reports/runtime

      - name: Scan bot image
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: summyz-community-bot:ci
          ignore-unfixed: false
          format: json
          output: artifacts/reports/runtime/trivy-bot.json
          exit-code: "0"
          version: v0.74.0

      - name: Scan dashboard image
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: summyz-community-dashboard:ci
          ignore-unfixed: false
          format: json
          output: artifacts/reports/runtime/trivy-dashboard.json
          exit-code: "0"
          version: v0.74.0

      - name: Scan CPU transcription image
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: summyz-community-faster-whisper:ci
          ignore-unfixed: false
          format: json
          output: artifacts/reports/runtime/trivy-faster-whisper.json
          exit-code: "0"
          version: v0.74.0

      - name: Enforce fixable HIGH/CRITICAL image vulnerabilities
        if: always()
        shell: bash
        run: |
          jq -s -e '
            [
              .[]
              | .Results[]?.Vulnerabilities[]?
              | select(
                  (.Severity == "HIGH" or .Severity == "CRITICAL")
                  and ((.FixedVersion // "") | length > 0)
                )
            ] | length == 0
          ' artifacts/reports/runtime/trivy-bot.json \
            artifacts/reports/runtime/trivy-dashboard.json \
            artifacts/reports/runtime/trivy-faster-whisper.json

      - name: Reclaim Docker storage before CUDA packaging
        run: |
          docker image prune --all --force
          docker buildx prune --all --force

      - name: Build NVIDIA packaging target
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/faster-whisper/Dockerfile
          target: cuda
          load: false
          tags: summyz-community-faster-whisper-cuda:ci
          cache-from: type=gha,scope=summyz-python-cuda
          cache-to: type=gha,mode=max,scope=summyz-python-cuda,ignore-error=true

      - name: Upload runtime reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-runtime
          path: artifacts/reports/runtime
          if-no-files-found: warn

  quality-gate:
    name: Quality Gate
    if: always()
    needs: [quality, security, tests, runtime]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download all reports
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: ci-*
          path: artifacts/reports

      - name: Locate the latest successful main baseline
        id: baseline
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo,
              branch: context.payload.repository?.default_branch ?? "main",
              event: "push",
              status: "success",
              workflow_id: "ci.yml",
              per_page: 50,
            });
            for (const run of runs) {
              if (run.id === context.runId) continue;
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...context.repo,
                run_id: run.id,
                per_page: 100,
              });
              if (artifacts.some((artifact) =>
                artifact.name === "ci-quality-gate-baseline" && !artifact.expired
              )) {
                core.setOutput("run-id", String(run.id));
                return;
              }
            }
            core.notice("No successful main Quality Gate baseline is available yet.");

      - name: Download the main baseline
        if: steps.baseline.outputs.run-id != ''
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ci-quality-gate-baseline
          path: baseline
          github-token: ${{ github.token }}
          run-id: ${{ steps.baseline.outputs.run-id }}

      - name: Set up exact Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked Quality Gate dependencies
        run: |
          npm install --global "npm@${NPM_VERSION}"
          npm ci

      - name: Analyze the Quality Gate
        shell: bash
        env:
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          ./node_modules/.bin/tsx scripts/ci/quality-gate-cli.ts artifacts/reports baseline ci-summary.md
          cat ci-summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload aggregate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-quality-gate
          path: |
            ci-summary.md
            quality-gate-result.json
            artifacts/reports
          if-no-files-found: warn

      - name: Upload the main Quality Gate baseline
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-quality-gate-baseline
          path: quality-gate-baseline.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce aggregate gate
        shell: bash
        run: jq --exit-status '.passed == true' quality-gate-result.json
