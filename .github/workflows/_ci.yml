name: CI implementation

on:
  workflow_call:

env:
  NODE_VERSION: 22.23.2
  NPM_VERSION: 10.9.8
  PYTHON_VERSION: 3.12.14

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up exact Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked Node.js dependencies
        run: |
          npm install --global "npm@${NPM_VERSION}"
          npm ci

      - name: Verify npm and Node.js versions
        shell: bash
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"

      - name: Check formatting, linting, types, and builds
        shell: bash
        run: |
          mkdir -p reports/quality
          quality_status=0
          ./node_modules/.bin/biome ci . --reporter=sarif \
            --reporter-file=reports/quality/biome.sarif || quality_status=1
          npm run typecheck 2>&1 | tee reports/quality/typecheck-server.txt || quality_status=1
          npm run typecheck:web 2>&1 | tee reports/quality/typecheck-dashboard.txt || quality_status=1
          npm run build 2>&1 | tee reports/quality/build.txt || quality_status=1
          echo "${quality_status}" > reports/quality/node.status

      - name: Set up exact Python
        if: always()
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install verified CI tools
        if: always()
        run: python -m pip install --require-hashes --requirement requirements-ci.lock

      - name: Check Python formatting, linting, and types
        if: always()
        shell: bash
        run: |
          mkdir -p reports/quality
          quality_status=0
          ruff check services/faster-whisper --output-format sarif \
            --output-file reports/quality/ruff.sarif || quality_status=1
          ruff format --check services/faster-whisper 2>&1 \
            | tee reports/quality/ruff-format.txt || quality_status=1
          mypy services/faster-whisper 2>&1 \
            | tee reports/quality/mypy.txt || quality_status=1
          echo "${quality_status}" > reports/quality/python.status

      - name: Analyze source metrics
        if: always()
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git diff --output=reports/quality/source.diff "${BASE_SHA}...HEAD" -- \
            src web/src services/faster-whisper
          ./node_modules/.bin/jscpd \
            --min-lines 5 \
            --min-tokens 50 \
            --threshold 3 \
            --exit-code 0 \
            --reporters console,json,html \
            --output reports/quality/jscpd \
            --format typescript,tsx,python \
            --skip-comments \
            --ignore "**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/test_*.py,**/*.d.ts" \
            --absolute \
            src web/src services/faster-whisper
          lizard -l typescript -l tsx -l python -C 10 -i -1 \
            -x "*test*" -x "*spec*" --csv -o reports/quality/lizard.csv \
            src web/src services/faster-whisper
          lizard -l typescript -l tsx -l python -C 10 -i -1 \
            -x "*test*" -x "*spec*" --xml -o reports/quality/lizard.xml \
            src web/src services/faster-whisper
          ./node_modules/.bin/tsx scripts/ci/source-quality-cli.ts \
            reports/quality/source.diff \
            reports/quality/jscpd/jscpd-report.json \
            reports/quality/lizard.csv \
            reports/quality/lizard.xml \
            reports/quality/source-quality.json

      - name: Enforce quality checks
        if: always()
        shell: bash
        run: |
          test "$(cat reports/quality/node.status 2>/dev/null)" = "0"
          test "$(cat reports/quality/python.status 2>/dev/null)" = "0"

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-quality
          path: reports/quality
          if-no-files-found: warn

  security:
    name: Security
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the complete tested history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up exact Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked Node.js dependencies
        run: |
          npm install --global "npm@${NPM_VERSION}"
          npm ci

      - name: Initialize security reports
        if: always()
        run: mkdir -p reports/security

      - name: Audit Node.js runtime dependencies
        shell: bash
        run: |
          set +e
          npm audit --omit=optional --json > reports/security/npm-audit.json
          audit_status=$?
          set -e
          test "${audit_status}" -le 1
          node -e 'const report=require("./reports/security/npm-audit.json"); if(report.error) process.exit(1)'

      - name: Set up exact Python
        if: always()
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install verified security tools
        if: always()
        run: python -m pip install --require-hashes --requirement requirements-ci.lock

      - name: Audit Python runtime dependencies
        if: always()
        shell: bash
        run: |
          audit_status=0
          pip-audit --strict --requirement services/faster-whisper/requirements.lock \
            --format json --output reports/security/pip-audit.json || audit_status=$?
          test "${audit_status}" -le 1

      - name: Scan GitHub Actions definitions
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          zizmor --min-severity medium --format sarif
          .github/workflows > reports/security/zizmor.sarif

      - name: Scan the complete history for secrets
        if: always()
        shell: bash
        run: |
          docker run --rm -v "${PWD}:/repo" \
            zricethezav/gitleaks:v8.24.0@sha256:2bcceac45179b3a91bff11a824d0fb952585b429e54fc928728b1d4d5c3e5176 \
            detect --source=/repo --redact --verbose --no-banner \
              --report-format=sarif --report-path=/repo/reports/security/gitleaks.sarif

      - name: Report every repository vulnerability
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          ignore-unfixed: false
          format: json
          output: reports/security/trivy-filesystem.json
          exit-code: "0"
          version: v0.74.0

      - name: Enforce repository secret and misconfiguration policy
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          limit-severities-for-sarif: true
          output: reports/security/trivy-policy.sarif
          exit-code: "1"
          version: v0.74.0

      - name: Enforce fixable HIGH/CRITICAL dependency vulnerabilities
        if: always()
        shell: bash
        run: |
          jq -e '
            [
              .Results[]?.Vulnerabilities[]?
              | select(
                  (.Severity == "HIGH" or .Severity == "CRITICAL")
                  and ((.FixedVersion // "") | length > 0)
                )
            ] | length == 0
          ' reports/security/trivy-filesystem.json
          jq -e '
            [
              .vulnerabilities[]?
              | select(
                  (.severity == "high" or .severity == "critical")
                  and (.fixAvailable != false and .fixAvailable != null)
                )
            ] | length == 0
          ' reports/security/npm-audit.json

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-security
          path: reports/security
          if-no-files-found: warn

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: summyz_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_USER: summyz_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U summyz_ci -d summyz_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out the tested revision and its base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the exact Node.js test environment
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: test
          load: true
          tags: summyz-community-tests:ci
          cache-from: type=gha,scope=summyz-node-tests
          cache-to: type=gha,mode=max,scope=summyz-node-tests,ignore-error=true

      - name: Initialize test reports
        run: |
          mkdir -p reports
          chmod 0777 reports

      - name: Run server tests with real PostgreSQL and coverage
        run: >-
          docker run --rm --network host
          --env POSTGRES_TEST_URL=postgresql://summyz_ci:ci-only-password@127.0.0.1:5432/summyz_ci
          --volume "${{ github.workspace }}/reports:/app/reports"
          summyz-community-tests:ci npm run test:coverage:ci

      - name: Run dashboard tests with coverage
        if: always()
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}/reports:/app/reports"
          summyz-community-tests:ci npm run test:web:coverage

      - name: Build the exact Python test environment
        if: always()
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/faster-whisper/Dockerfile
          target: test
          load: true
          tags: summyz-community-python-tests:ci
          cache-from: type=gha,scope=summyz-python-tests
          cache-to: type=gha,mode=max,scope=summyz-python-tests,ignore-error=true

      - name: Run Python tests with coverage
        if: always()
        run: |
          mkdir -p reports/python
          chmod 0777 reports/python
          docker run --rm \
            --volume "${{ github.workspace }}/reports:/workspace/reports" \
            summyz-community-python-tests:ci \
            python -m pytest services/faster-whisper \
            --cov=services/faster-whisper --cov-branch --cov-fail-under=85 \
            --cov-report=term-missing --cov-report=xml:reports/python/coverage.xml \
            --cov-report=json:reports/python/coverage.json \
            --cov-report=html:reports/python/coverage --junitxml=reports/python/junit.xml

      - name: Enforce 85% coverage for each domain group
        if: always()
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}/reports:/app/reports"
          summyz-community-tests:ci
          ./node_modules/.bin/tsx scripts/ci/coverage-domains.ts
          reports/server/coverage/coverage-summary.json
          reports/web/coverage/coverage-summary.json
          reports/python/coverage.json
          reports/domain-coverage/results.json

      - name: Set up exact Python for changed-code coverage # zizmor: ignore[cache-poisoning] Installs remain hash-verified.
        if: always()
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install verified coverage tools
        if: always()
        run: python -m pip install --require-hashes --requirement requirements-ci.lock

      - name: Measure coverage on changed code
        if: always()
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p reports/diff-coverage
          git diff --output=reports/diff-coverage/server.diff "${BASE_SHA}...HEAD" -- src
          git diff --relative=web --output=reports/diff-coverage/web.diff "${BASE_SHA}...HEAD" -- web
          git diff --relative=services/faster-whisper \
            --output=reports/diff-coverage/python.diff \
            "${BASE_SHA}...HEAD" -- services/faster-whisper
          for component in server web python; do
            case "${component}" in
              server) report="reports/server/coverage/cobertura-coverage.xml" ;;
              web) report="reports/web/coverage/cobertura-coverage.xml" ;;
              python) report="reports/python/coverage.xml" ;;
            esac
            if [[ -s "${report}" ]]; then
              diff-cover "${report}" \
                --diff-file "reports/diff-coverage/${component}.diff" \
                --format "html:reports/diff-coverage/${component}.html,json:reports/diff-coverage/${component}.json" \
                --fail-under 0
            else
              echo "::error::Missing ${component} coverage report: ${report}"
              exit 1
            fi
          done
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "${{ github.workspace }}/reports:/app/reports" \
            summyz-community-tests:ci \
            ./node_modules/.bin/tsx scripts/ci/changed-coverage-cli.ts \
            reports/diff-coverage/server.json \
            reports/diff-coverage/web.json \
            reports/diff-coverage/python.json \
            reports/diff-coverage/global.json \
            reports/diff-coverage/global.md

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-tests-coverage
          path: reports
          if-no-files-found: error

  runtime:
    name: Runtime / Images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build bot image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: bot-runtime
          load: true
          tags: summyz-community-bot:ci
          cache-from: type=gha,scope=summyz-runtime
          cache-to: type=gha,mode=max,scope=summyz-runtime,ignore-error=true

      - name: Build dashboard image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: dashboard-runtime
          load: true
          tags: summyz-community-dashboard:ci
          cache-from: type=gha,scope=summyz-runtime
          cache-to: type=gha,mode=max,scope=summyz-runtime,ignore-error=true

      - name: Build CPU transcription image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/faster-whisper/Dockerfile
          target: cpu
          load: true
          tags: summyz-community-faster-whisper:ci
          cache-from: type=gha,scope=summyz-python-runtime
          cache-to: type=gha,mode=max,scope=summyz-python-runtime,ignore-error=true

      - name: Build smoke-test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: test
          load: true
          tags: summyz-community-smoke:latest
          cache-from: type=gha,scope=summyz-node-tests
          cache-to: type=gha,mode=max,scope=summyz-node-tests,ignore-error=true

      - name: Validate image users, versions, and Compose overlays
        shell: bash
        env:
          CI_OLLAMA_CACHE: ${{ github.workspace }}/.ci-cache/ollama
          CI_WHISPER_CACHE: ${{ github.workspace }}/.ci-cache/faster-whisper
          POSTGRES_PASSWORD: ci-only-password
        run: |
          test "$(docker run --rm --entrypoint node summyz-community-bot:ci --version)" = "v${NODE_VERSION}"
          test "$(docker run --rm --entrypoint node summyz-community-dashboard:ci --version)" = "v${NODE_VERSION}"
          test "$(docker run --rm --entrypoint id summyz-community-bot:ci -u)" != "0"
          test "$(docker run --rm --entrypoint id summyz-community-dashboard:ci -u)" != "0"
          test "$(docker run --rm --entrypoint python summyz-community-faster-whisper:ci --version 2>&1)" = "Python ${PYTHON_VERSION}"
          test "$(docker run --rm --entrypoint id summyz-community-faster-whisper:ci -u)" != "0"
          docker compose -f docker-compose.yaml -f .github/ci/docker-compose.ci.yaml config --quiet
          docker compose -f docker-compose.yaml -f docker-compose.nvidia.yaml -f .github/ci/docker-compose.ci.yaml config --quiet
          docker compose -f docker-compose.yaml -f docker-compose.amd.yaml -f .github/ci/docker-compose.ci.yaml config --quiet

      - name: Restore immutable local-model cache # zizmor: ignore[cache-poisoning] PR cache scope is isolated and models are verified.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-cache
          key: local-ai-d90ca5fe260221311c53c58e660288d3deb8d356-8f68893c685c3ddff2aa3fffce2aa60a30bb2da65ca488b61fff134a4d1730e7

      - name: Run real CPU local-AI smoke test
        shell: bash
        env:
          CI_OLLAMA_CACHE: ${{ github.workspace }}/.ci-cache/ollama
          CI_WHISPER_CACHE: ${{ github.workspace }}/.ci-cache/faster-whisper
          POSTGRES_PASSWORD: ci-only-password
          SMOKE_OLLAMA_DIGEST: sha256:8f68893c685c3ddff2aa3fffce2aa60a30bb2da65ca488b61fff134a4d1730e7
          SMOKE_OLLAMA_MODEL: qwen3:1.7b
          SMOKE_WHISPER_MODEL: tiny
          SMOKE_WHISPER_REVISION: d90ca5fe260221311c53c58e660288d3deb8d356
        run: |
          mkdir -p "${CI_OLLAMA_CACHE}" "${CI_WHISPER_CACHE}"
          docker tag summyz-community-faster-whisper:ci summyz-community-faster-whisper:latest
          docker compose -f docker-compose.yaml -f .github/ci/docker-compose.ci.yaml \
            --profile smoke up --detach --no-build ollama faster-whisper
          docker compose -f docker-compose.yaml -f .github/ci/docker-compose.ci.yaml \
            --profile smoke run --rm --no-deps \
            -e SMOKE_OLLAMA_DIGEST -e SMOKE_OLLAMA_MODEL \
            -e SMOKE_WHISPER_MODEL -e SMOKE_WHISPER_REVISION smoke

      - name: Stop local-AI services
        if: always()
        env:
          CI_OLLAMA_CACHE: ${{ github.workspace }}/.ci-cache/ollama
          CI_WHISPER_CACHE: ${{ github.workspace }}/.ci-cache/faster-whisper
          POSTGRES_PASSWORD: ci-only-password
        run: >-
          docker compose -f docker-compose.yaml -f .github/ci/docker-compose.ci.yaml
          --profile smoke down --volumes

      - name: Initialize runtime reports
        if: always()
        run: mkdir -p reports/runtime

      - name: Scan bot image
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: summyz-community-bot:ci
          ignore-unfixed: false
          format: json
          output: reports/runtime/trivy-bot.json
          exit-code: "0"
          version: v0.74.0

      - name: Scan dashboard image
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: summyz-community-dashboard:ci
          ignore-unfixed: false
          format: json
          output: reports/runtime/trivy-dashboard.json
          exit-code: "0"
          version: v0.74.0

      - name: Scan CPU transcription image
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: summyz-community-faster-whisper:ci
          ignore-unfixed: false
          format: json
          output: reports/runtime/trivy-faster-whisper.json
          exit-code: "0"
          version: v0.74.0

      - name: Enforce fixable HIGH/CRITICAL image vulnerabilities
        if: always()
        shell: bash
        run: |
          jq -s -e '
            [
              .[]
              | .Results[]?.Vulnerabilities[]?
              | select(
                  (.Severity == "HIGH" or .Severity == "CRITICAL")
                  and ((.FixedVersion // "") | length > 0)
                )
            ] | length == 0
          ' reports/runtime/trivy-bot.json \
            reports/runtime/trivy-dashboard.json \
            reports/runtime/trivy-faster-whisper.json

      - name: Reclaim Docker storage before CUDA packaging
        run: |
          docker image prune --all --force
          docker buildx prune --all --force

      - name: Build NVIDIA packaging target
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/faster-whisper/Dockerfile
          target: cuda
          load: false
          tags: summyz-community-faster-whisper-cuda:ci
          cache-from: type=gha,scope=summyz-python-cuda
          cache-to: type=gha,mode=max,scope=summyz-python-cuda,ignore-error=true

      - name: Upload runtime reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-runtime
          path: reports/runtime
          if-no-files-found: warn

  quality-gate:
    name: Quality Gate
    if: always()
    needs: [quality, security, tests, runtime]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download all reports
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: ci-*
          path: reports

      - name: Locate the latest successful main baseline
        id: baseline
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo,
              branch: context.payload.repository?.default_branch ?? "main",
              event: "push",
              status: "success",
              workflow_id: "ci.yml",
              per_page: 50,
            });
            for (const run of runs) {
              if (run.id === context.runId) continue;
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...context.repo,
                run_id: run.id,
                per_page: 100,
              });
              if (artifacts.some((artifact) =>
                artifact.name === "ci-quality-gate-baseline" && !artifact.expired
              )) {
                core.setOutput("run-id", String(run.id));
                return;
              }
            }
            core.notice("No successful main Quality Gate baseline is available yet.");

      - name: Download the main baseline
        if: steps.baseline.outputs.run-id != ''
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ci-quality-gate-baseline
          path: baseline
          github-token: ${{ github.token }}
          run-id: ${{ steps.baseline.outputs.run-id }}

      - name: Set up exact Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked Quality Gate dependencies
        run: |
          npm install --global "npm@${NPM_VERSION}"
          npm ci

      - name: Analyze the Quality Gate
        shell: bash
        env:
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          ./node_modules/.bin/tsx scripts/ci/quality-gate-cli.ts reports baseline ci-summary.md
          cat ci-summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload aggregate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-quality-gate
          path: |
            ci-summary.md
            quality-gate-result.json
            reports
          if-no-files-found: warn

      - name: Upload the main Quality Gate baseline
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-quality-gate-baseline
          path: quality-gate-baseline.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce aggregate gate
        shell: bash
        run: jq --exit-status '.passed == true' quality-gate-result.json
