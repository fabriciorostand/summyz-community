name: CLA

on: # zizmor: ignore[dangerous-triggers] Only trusted default-branch code runs with read-only permissions.
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-individual-cla:
    name: Individual
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate the individual CLA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/cla/check-pull-request.mjs
