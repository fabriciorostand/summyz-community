services:
  bot:
    env_file: !reset []

  dashboard:
    env_file: !reset []

  ollama:
    environment:
      CUDA_VISIBLE_DEVICES: "-1"
      GGML_VK_VISIBLE_DEVICES: "-1"
      HIP_VISIBLE_DEVICES: "-1"
      OLLAMA_LLM_LIBRARY: cpu
      OLLAMA_VULKAN: "false"
      ROCR_VISIBLE_DEVICES: "-1"
    volumes:
      - ${CI_OLLAMA_CACHE}:/root/.ollama

  faster-whisper:
    volumes:
      - ${CI_WHISPER_CACHE}:/models

  smoke:
    image: summyz-community-smoke:latest
