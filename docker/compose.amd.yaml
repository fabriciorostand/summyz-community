services:
  ollama-gpu:
    entrypoint: ["/bin/sh", "/usr/local/bin/summyz-ollama-gpu"]
    image: ollama/ollama:0.33.3-rocm@sha256:5ca37b5898b84dc522f98927910d43d440acbed3774888267ea91a8452649c14
    profiles: ["gpu"]
    restart: unless-stopped
    user: "1000:1000"
    expose: ["11434"]
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_models:/model-storage:ro
      - ./scripts/ollama-gpu-entrypoint:/usr/local/bin/summyz-ollama-gpu:ro
    environment:
      OLLAMA_NOPRUNE: "true"
      HOME: /tmp
      OLLAMA_MODELS: /model-storage/models
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/summyz-gpu-ready && ollama list"]
      interval: 10s
      timeout: 5s
      retries: 6
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - render

  bot:
    environment:
      SUMMYZ_DETECTED_GPU_MEMORY_BYTES: ${SUMMYZ_DETECTED_GPU_MEMORY_BYTES:-}
      SUMMYZ_DETECTED_GPU_NAME: ${SUMMYZ_DETECTED_GPU_NAME:-AMD GPU}
      SUMMYZ_DETECTED_GPU_VENDOR: ${SUMMYZ_DETECTED_GPU_VENDOR:-amd}

  dashboard:
    environment:
      SUMMYZ_DETECTED_GPU_MEMORY_BYTES: ${SUMMYZ_DETECTED_GPU_MEMORY_BYTES:-}
      SUMMYZ_DETECTED_GPU_NAME: ${SUMMYZ_DETECTED_GPU_NAME:-AMD GPU}
      SUMMYZ_DETECTED_GPU_VENDOR: ${SUMMYZ_DETECTED_GPU_VENDOR:-amd}
