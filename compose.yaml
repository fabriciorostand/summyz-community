name: summyz-community

services:
  model-storage-init:
    image: ollama/ollama:0.33.3@sha256:32931b46719f673c05fdbaa81ccb26da18ea4a1c57590a754874ab28ba269eb2
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /model-storage/models/blobs && chown -R 1000:1000 /model-storage"]
    volumes:
      - ollama_models:/model-storage

  ollama:
    image: ollama/ollama:0.33.3@sha256:32931b46719f673c05fdbaa81ccb26da18ea4a1c57590a754874ab28ba269eb2
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      model-storage-init:
        condition: service_completed_successfully
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - ollama_models:/model-storage
    environment:
      OLLAMA_LLM_LIBRARY: cpu
      HOME: /model-storage
      OLLAMA_MODELS: /model-storage/models

  faster-whisper:
    image: summyz-community-faster-whisper
    build:
      context: .
      dockerfile: services/faster-whisper/Dockerfile
      target: cpu
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - faster_whisper_models:/models

  postgres:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-summyz-community-db}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:-summyz_community}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  bot:
    image: summyz-community-bot
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: bot-runtime
    restart: unless-stopped
    depends_on:
      faster-whisper:
        condition: service_healthy
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - summyz_community_data:/app/data

  dashboard:
    image: summyz-community-dashboard
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dashboard-runtime
    restart: unless-stopped
    depends_on:
      model-storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8787
    ports:
      - "${WEB_HOST:-127.0.0.1}:${WEB_PORT:-8787}:8787"
    volumes:
      - ollama_models:/models/ollama

  smoke:
    profiles: ["smoke"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: test
    depends_on:
      faster-whisper:
        condition: service_healthy
      ollama:
        condition: service_healthy

  benchmark:
    profiles: ["benchmark"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: test
    command: ["npm", "run", "benchmark:transcription"]
    depends_on:
      faster-whisper:
        condition: service_healthy
    environment:
      BENCHMARK_DATA_DIR: /benchmark-data/recordings
      FASTER_WHISPER_BENCHMARK_URL: http://faster-whisper:8000
    volumes:
      - ./data:/benchmark-data:ro

volumes:
  faster_whisper_models:
  ollama_models:
  postgres_data:
  summyz_community_data:
